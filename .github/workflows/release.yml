name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Bump, tag, draft
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      release_id: ${{ steps.draft.outputs.release_id }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # createUpdaterArtifacts is enabled in tauri.conf.json. Without the
      # matching private key Tauri can build an installer, but fails when it
      # tries to sign the updater artifact.
      - name: Check updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::Add TAURI_SIGNING_PRIVATE_KEY to the repository's Actions secrets."
            exit 1
          fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "::error::Add TAURI_SIGNING_PRIVATE_KEY_PASSWORD to the repository's Actions secrets."
            exit 1
          fi

      - name: Work out next version
        id: bump
        shell: bash
        run: |
          NEXT=$(node -p "
            const [major, minor, patch] =
              require('./package.json').version.split('.');

            [major, minor, Number(patch) + 1].join('.')
          ")

          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"

          bash .github/scripts/bump-version.sh "$NEXT"

      - name: Commit and tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -am \
            "chore(release): ${{ steps.bump.outputs.tag }} [skip ci]"

          git tag -a \
            "${{ steps.bump.outputs.tag }}" \
            -m "${{ steps.bump.outputs.tag }}"

          git push origin HEAD:main
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}

        shell: bash
        run: |
          gh release create "$TAG" \
            --draft \
            --generate-notes \
            --title "PortBaba $TAG"

          echo "release_id=$(
            gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq .id
          )" >> "$GITHUB_OUTPUT"


  build:
    name: ${{ matrix.name }}

    needs:
      - version

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis

          - name: macOS Universal
            platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg

    runs-on: ${{ matrix.platform }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{ matrix.platform == 'macos-latest'
              && 'aarch64-apple-darwin,x86_64-apple-darwin'
              || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          releaseId: ${{ needs.version.outputs.release_id }}
          tagName: ${{ needs.version.outputs.tag }}
          releaseDraft: true
          retryAttempts: 0
          args: ${{ matrix.args }}


  publish:
    name: Publish

    needs:
      - version
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          gh release edit \
            "${{ needs.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
